name: Auto-Fix CI Failures

on:
  workflow_run:
    workflows: ['CI Build']
    types:
      - completed

jobs:
  auto-fix:
    # Never execute fork code with secrets and write permissions.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the SHA from the failed workflow run
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download failed build logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: gh run view "$FAILED_RUN_ID" --attempt "$FAILED_RUN_ATTEMPT" --log-failed > "$RUNNER_TEMP/failed-build.log"

      - name: Run Auto-Fix
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY2 }}
          prompt: |
            A CI build has failed. Analyze the errors and fix them automatically.

            **Build Details:**
            - Repository: ${{ github.repository }}
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Workflow Run URL: ${{ github.event.workflow_run.html_url }}

            **Your Task:**
            1. Read the failed workflow logs at ${{ runner.temp }}/failed-build.log and analyze the errors
            2. Identify the root causes (build errors, linting problems, tests, etc.)
            3. Perform automatic fixes for:
               - YAML syntax errors in frontmatter
               - TypeScript/JavaScript errors
               - Import/export problems
               - Package.json dependencies
            4. Test the fixes locally with `npm run typecheck` and `npm run build`
            5. Commit the changes with a descriptive commit message

            **Important Rules:**
            - Use Conventional Commits standard
            - ALWAYS test with `npm run typecheck` and `npm run build` before committing
            - If multiple fixes are needed, create separate commits
            - For critical errors, create an issue instead of auto-fixing

            **Example Commit Messages:**
            - `fix: yaml syntax error in blog frontmatter`
            - `chore: update dependencies to resolve build issues`

            Begin by analyzing the workflow logs!

      - name: Verify fixes with CI checks
        run: |
          npm run typecheck
          npm run build

      - name: Create Pull Request if changes were made
        if: success()
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected, but they should already be committed by Claude"
            echo "Checking if we're on main branch..."
            if [[ $(git branch --show-current) == "main" ]]; then
              echo "Direct commits to main detected"
              git log -1 --pretty=format:"%h - %s (%an)"
            fi
          else
            echo "No uncommitted changes found"
          fi

  notify-failure:
    if: ${{ always() && needs.auto-fix.result == 'failure' }}
    permissions:
      issues: write
    needs: auto-fix
    runs-on: ubuntu-latest
    steps:
      - name: Create issue for failed auto-fix
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 Auto-Fix Failed - Manual Intervention Required',
              body: `## Auto-Fix Error

            The automatic fix for the CI error has failed.

            **Details:**
            - Workflow: ${{ github.event.workflow_run.name }}
            - Branch: ${{ github.event.workflow_run.head_branch }}
            - Commit: ${{ github.event.workflow_run.head_sha }}
            - Auto-Fix Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Original Failed Run: ${{ github.event.workflow_run.html_url }}

            Please review the logs and fix the issues manually.`,
              labels: ['bug', 'auto-fix-failed', 'needs-attention']
            })
